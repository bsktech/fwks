<!DOCTYPE html>
<html lang="pt-BR">

<meta charset="UTF-8" />
<title>Bosses — Versão B · Grid de Cards</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --g900:#0d2b14; --g800:#14532d; --g700:#166534; --g600:#15803d;

    --ink:#111827; --ink2:#374151; --ink3:#6b7280; --rule:#e5e7eb;
    --surface:#fff; --bg:#f8faf8;
    --pixel:'Press Start 2P', monospace; --sans:'Inter', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh}
  .wrap{max-width:1280px;margin:0 auto;padding:2.5rem 2rem 5rem}
  h1{font-family:var(--pixel);font-size:1.4rem;color:var(--g700);letter-spacing:1px;margin-bottom:.6rem}
  .sub{color:var(--ink3);font-size:.95rem;margin-bottom:2rem;max-width:680px;line-height:1.5}

  .toolbar{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;justify-content:space-between;margin-bottom:2rem;padding:1rem 1.2rem;background:var(--surface);border:1.5px solid var(--rule);border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .group{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
  .group > span{font-weight:700;font-size:.85rem;color:var(--ink2);margin-right:.3rem}
  .pill{font-family:var(--sans);font-weight:600;font-size:.82rem;padding:.45rem .95rem;border-radius:100px;border:1.5px solid var(--rule);background:#fff;color:var(--ink2);cursor:pointer;transition:all .15s}
  .pill:hover{border-color:var(--g400);color:var(--g700)}
  .pill.active{background:var(--g500);color:#fff;border-color:var(--g500);box-shadow:0 2px 8px rgba(22,163,74,.3)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.1rem}
  .card{background:var(--surface);border:1.5px solid var(--rule);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s,border-color .15s;cursor:pointer;position:relative}
  .card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,.1);border-color:var(--g300)}
  .stripe{height:6px;background:var(--g500)}
  .card[data-cat="rival"] .stripe{background:#dc2626}
  .card[data-cat="gym"] .stripe{background:#15803d}
  .card[data-cat="villain"] .stripe{background:#581c87}
  .card[data-cat="e4"] .stripe{background:#b45309}
  .card[data-cat="champ"] .stripe{background:linear-gradient(90deg,#d97706,#fbbf24,#d97706)}

  .card-head{padding:1.1rem 1.2rem .8rem;display:flex;justify-content:space-between;align-items:flex-start;gap:.8rem}
  .left{flex:1;min-width:0}
  .tag{display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .55rem;border-radius:100px;font-size:.65rem;font-weight:700;letter-spacing:.4px;text-transform:uppercase;margin-bottom:.4rem}
  .num{font-family:var(--pixel);font-size:.55rem;color:var(--ink3);margin-bottom:.3rem}
  .title{font-weight:800;font-size:1rem;color:var(--ink);line-height:1.25}
  .loc{color:var(--ink3);font-size:.78rem;margin-top:.25rem}

  .cap-block{text-align:center;background:linear-gradient(135deg,var(--g500),var(--g700));color:#fff;border-radius:12px;padding:.6rem .9rem;box-shadow:0 4px 14px rgba(22,163,74,.3);min-width:74px}
  .cap-label{font-family:var(--pixel);font-size:.5rem;opacity:.85;letter-spacing:1px;margin-bottom:.2rem}
  .cap-num{font-family:var(--pixel);font-size:1.25rem;letter-spacing:1px}

  .team-preview{padding:.6rem 1.2rem 1.1rem;display:flex;flex-wrap:wrap;gap:.3rem}
  .mini{font-size:.7rem;font-weight:600;padding:.22rem .55rem;border-radius:6px;background:var(--bg);border:1px solid var(--rule);color:var(--ink2);display:inline-flex;gap:.3rem;align-items:center}
  .mini-lvl{font-family:var(--pixel);font-size:.55rem;color:var(--ink3)}
  .dot{width:8px;height:8px;border-radius:50%}

  .card-foot{margin-top:auto;padding:.7rem 1.2rem;border-top:1px solid var(--rule);background:var(--g50);font-size:.75rem;color:var(--ink2);display:flex;justify-content:space-between;align-items:center}
  .reward{font-family:var(--pixel);font-size:.6rem;color:var(--g700)}

  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:100;padding:2rem}
  .modal-bg.open{display:flex}
  .modal{background:#fff;border-radius:20px;max-width:640px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.3)}
  .modal-head{padding:1.4rem 1.6rem 1rem;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:flex-start;gap:1rem}
  .modal-title{font-weight:800;font-size:1.15rem;color:var(--ink)}
  .close{background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--ink3);line-height:1}
  .modal-body{padding:1.2rem 1.6rem 1.6rem}
  .note{font-size:.9rem;color:var(--ink2);background:var(--g50);border-left:3px solid var(--g400);padding:.8rem 1rem;border-radius:8px;margin-bottom:1.2rem;line-height:1.5}
  .team-full{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.7rem}
  .mon{background:var(--bg);border:1px solid var(--rule);border-radius:12px;padding:.7rem .85rem}
  .mon-name{font-weight:700;font-size:.9rem;color:var(--ink);display:flex;justify-content:space-between;gap:.5rem;margin-bottom:.4rem}
  .mon-lvl{color:var(--ink3);font-family:var(--pixel);font-size:.6rem}
  .types{display:flex;gap:.25rem;flex-wrap:wrap}
  .type{font-size:.62rem;font-weight:700;padding:.22rem .5rem;border-radius:6px;color:#fff;text-transform:uppercase;letter-spacing:.3px}
</style>
</head>

})();

window.TYPE_COLORS = {
  Normal: '#A8A878', Fire: '#F08030', Water: '#6890F0', Electric: '#F8D030',
  Grass: '#78C850', Ice: '#98D8D8', Fighting: '#C03028', Poison: '#A040A0',
  Ground: '#E0C068', Flying: '#A890F0', Psychic: '#F85888', Bug: '#A8B820',
  Rock: '#B8A038', Ghost: '#705898', Dragon: '#7038F8', Dark: '#705848',
  Steel: '#B8B8D0', Fairy: '#EE99AC',
};

window.CAT_META = {
  rival: { label: 'Rival', color: '#dc2626', bg: '#fee2e2', icon: '⚔️' },
  gym: { label: 'Líder de Ginásio', color: '#15803d', bg: '#dcfce7', icon: '🏅' },
  villain: { label: 'Team Rocket', color: '#581c87', bg: '#f3e8ff', icon: '🦹' },
  e4: { label: 'Elite dos Quatro', color: '#b45309', bg: '#fef3c7', icon: '👑' },
  champ: { label: 'Campeão', color: '#d97706', bg: '#fef3c7', icon: '🏆' },
};

</script>
<script>
  let starter = 'char';
  let filter = 'all';
  const $grid = document.getElementById('grid');
  const $modal = document.getElementById('modal');
  const $modalContent = document.getElementById('modal-content');

  const teamFor = b => b.teams.all || b.teams[starter] || [];

  function render() {
    $grid.innerHTML = '';
    BOSSES.filter(b => filter === 'all' || b.cat === filter).forEach(b => {
      const meta = CAT_META[b.cat];
      const team = teamFor(b);
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.cat = b.cat;
      card.innerHTML = `
        <div class="stripe"></div>
        <div class="card-head">
          <div class="left">
            <div class="num">#${String(b.n).padStart(2, '0')}</div>
            <span class="tag" style="background:${meta.bg};color:${meta.color}">${meta.icon} ${meta.label}${b.badge ? ' · ' + b.badge : ''}</span>
            <div class="title">${b.name.replace(/ — .*$/, '')}</div>
            <div class="loc">📍 ${b.loc}</div>
          </div>
          <div class="cap-block">
            <div class="cap-label">Lv Cap</div>
            <div class="cap-num">${b.cap}</div>
          </div>
        </div>
        <div class="team-preview">
          ${team.map(m => `
            <span class="mini">
              <span class="dot" style="background:${TYPE_COLORS[m.t[0]] || '#888'}"></span>
              ${m.n} <span class="mini-lvl">L${m.l}</span>
            </span>
          `).join('')}
        </div>
        <div class="card-foot">
          <span>${team.length} Pokémon</span>
          <span class="reward">💰 $${b.reward.toLocaleString('pt-BR')}</span>
        </div>
      `;
      card.addEventListener('click', () => openModal(b));
      $grid.appendChild(card);
    });
  }

  function openModal(b) {
    const meta = CAT_META[b.cat];
    const team = teamFor(b);
    $modalContent.innerHTML = `
      <div class="modal-head">
        <div>
          <span class="tag" style="background:${meta.bg};color:${meta.color}">${meta.icon} ${meta.label}${b.badge ? ' · ' + b.badge : ''}</span>
          <div class="modal-title" style="margin-top:.4rem">${b.name}</div>
          <div class="loc" style="color:var(--ink3);font-size:.85rem;margin-top:.3rem">📍 ${b.loc} · Lv Cap <strong style="color:var(--g700)">${b.cap}</strong> · 💰 $${b.reward.toLocaleString('pt-BR')}</div>
        </div>
        <button class="close" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body">
        <div class="note">💡 ${b.note}</div>
        <div class="team-full">
          ${team.map(m => `
            <div class="mon">
              <div class="mon-name"><span>${m.n}</span><span class="mon-lvl">Lv${m.l}</span></div>
              <div class="types">${m.t.map(t => `<span class="type" style="background:${TYPE_COLORS[t] || '#888'}">${t}</span>`).join('')}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
    $modal.classList.add('open');
  }
  function closeModal() { $modal.classList.remove('open'); }
  $modal.addEventListener('click', e => { if (e.target === $modal) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  document.querySelectorAll('.pill.starter').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.pill.starter').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); starter = b.dataset.starter; render();
  }));
  document.querySelectorAll('.pill.filter').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.pill.filter').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); filter = b.dataset.filter; render();
  }));

  render();
</script>
</body>
</html>

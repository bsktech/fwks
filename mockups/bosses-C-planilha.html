<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Bosses — Versão C · Planilha de Combate</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --g900:#0d2b14; --g800:#14532d; --g700:#166534; --g600:#15803d;
    --g500:#16a34a; --g400:#22c55e; --g300:#4ade80; --g100:#dcfce7; --g50:#f0fdf4;
    --ink:#111827; --ink2:#374151; --ink3:#6b7280; --rule:#e5e7eb;
    --surface:#fff; --bg:#f8faf8;
    --pixel:'Press Start 2P', monospace; --sans:'Inter', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh}
  .wrap{max-width:1320px;margin:0 auto;padding:2.5rem 1.5rem 5rem}
  h1{font-family:var(--pixel);font-size:1.4rem;color:var(--g700);letter-spacing:1px;margin-bottom:.6rem}
  .sub{color:var(--ink3);font-size:.95rem;margin-bottom:1.6rem;max-width:680px;line-height:1.5}

  .toolbar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:.7rem;align-items:center;padding:1rem 1.2rem;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border:1.5px solid var(--rule);border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.04);margin-bottom:1.5rem}
  .toolbar > span{font-weight:700;font-size:.85rem;color:var(--ink2)}
  .pill{font-family:var(--sans);font-weight:600;font-size:.82rem;padding:.45rem .95rem;border-radius:100px;border:1.5px solid var(--rule);background:#fff;color:var(--ink2);cursor:pointer;transition:all .15s}
  .pill:hover{border-color:var(--g400);color:var(--g700)}
  .pill.active{background:var(--g500);color:#fff;border-color:var(--g500);box-shadow:0 2px 8px rgba(22,163,74,.3)}
  .toolbar .sep{width:1px;height:24px;background:var(--rule);margin:0 .3rem}
  .legend{display:flex;gap:.7rem;font-size:.74rem;color:var(--ink3);margin-left:auto;align-items:center;flex-wrap:wrap}
  .leg{display:inline-flex;align-items:center;gap:.35rem}
  .leg .sw{width:10px;height:10px;border-radius:3px}

  .sheet{background:var(--surface);border:1.5px solid var(--rule);border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .sheet-head{display:grid;grid-template-columns:54px 1fr 130px 90px 1.4fr 1fr;gap:.8rem;padding:.9rem 1.1rem;background:var(--g50);border-bottom:1.5px solid var(--rule);font-family:var(--pixel);font-size:.6rem;letter-spacing:1.5px;color:var(--g700);text-transform:uppercase}
  .row{display:grid;grid-template-columns:54px 1fr 130px 90px 1.4fr 1fr;gap:.8rem;padding:.9rem 1.1rem;border-bottom:1px solid var(--rule);align-items:center;transition:background .12s;cursor:pointer}
  .row:last-child{border-bottom:none}
  .row:hover{background:var(--g50)}
  .row.open{background:var(--g50)}
  .num-cell{font-family:var(--pixel);font-size:.7rem;color:var(--ink3);display:flex;align-items:center;gap:.5rem}
  .cat-stripe{width:6px;height:32px;border-radius:3px;background:var(--g500)}
  .row[data-cat="rival"] .cat-stripe{background:#dc2626}
  .row[data-cat="gym"] .cat-stripe{background:#15803d}
  .row[data-cat="villain"] .cat-stripe{background:#581c87}
  .row[data-cat="e4"] .cat-stripe{background:#b45309}
  .row[data-cat="champ"] .cat-stripe{background:linear-gradient(180deg,#d97706,#fbbf24)}

  .name{font-weight:700;font-size:.95rem;color:var(--ink);line-height:1.25}
  .name-sub{font-size:.75rem;color:var(--ink3);margin-top:.15rem;display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
  .tag{display:inline-flex;align-items:center;gap:.25rem;padding:.12rem .5rem;border-radius:100px;font-size:.62rem;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
  .loc-cell{font-size:.82rem;color:var(--ink2)}
  .cap-cell{font-family:var(--pixel);font-size:.85rem;text-align:center;padding:.45rem .5rem;border-radius:8px;background:linear-gradient(135deg,var(--g500),var(--g700));color:#fff;box-shadow:0 2px 6px rgba(22,163,74,.25);width:fit-content;justify-self:center}
  .team-cell{display:flex;flex-wrap:wrap;gap:.3rem}
  .mini{font-size:.7rem;font-weight:600;padding:.18rem .45rem;border-radius:6px;background:var(--bg);border:1px solid var(--rule);color:var(--ink2);display:inline-flex;gap:.3rem;align-items:center}
  .mini-lvl{font-family:var(--pixel);font-size:.5rem;color:var(--ink3)}
  .dot{width:7px;height:7px;border-radius:50%}
  .reward-cell{font-family:var(--pixel);font-size:.65rem;color:var(--g700)}

  .detail{grid-column:1/-1;padding:.5rem 1.1rem 1.2rem;display:none;background:var(--bg)}
  .row.open + .detail{display:block}
  .note{font-size:.88rem;color:var(--ink2);background:#fff;border-left:3px solid var(--g400);padding:.7rem 1rem;border-radius:8px;margin:.6rem 0 1rem;line-height:1.5;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .team-full{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.6rem}
  .mon{background:#fff;border:1px solid var(--rule);border-radius:10px;padding:.6rem .75rem}
  .mon-name{font-weight:700;font-size:.85rem;color:var(--ink);display:flex;justify-content:space-between;gap:.4rem;margin-bottom:.35rem}
  .mon-lvl{color:var(--ink3);font-family:var(--pixel);font-size:.55rem}
  .types{display:flex;gap:.22rem;flex-wrap:wrap}
  .type{font-size:.6rem;font-weight:700;padding:.18rem .45rem;border-radius:6px;color:#fff;text-transform:uppercase;letter-spacing:.3px}

  @media (max-width: 900px){
    .sheet-head{display:none}
    .row{grid-template-columns:54px 1fr 90px;grid-template-areas:"num title cap" "num sub cap" "team team team" "reward reward reward";gap:.5rem .8rem}
    .num-cell{grid-area:num}
    .name{grid-area:title}
    .name-sub{grid-area:sub}
    .loc-cell{display:none}
    .cap-cell{grid-area:cap;justify-self:end}
    .team-cell{grid-area:team}
    .reward-cell{grid-area:reward;text-align:right}
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>📋 Bosses — Planilha</h1>

          p('Alakazam', 59, ['Psychic']),
          p('Rhydon', 61, ['Ground', 'Rock']),
          p('Arcanine', 61, ['Fire']),
          p('Exeggutor', 63, ['Grass', 'Psychic']),
          p('Blastoise', 65, ['Water']),
        ],
        squir: [
          p('Pidgeot', 61, ['Normal', 'Flying']),
          p('Alakazam', 59, ['Psychic']),
          p('Rhydon', 61, ['Ground', 'Rock']),
          p('Gyarados', 61, ['Water', 'Flying']),
          p('Arcanine', 63, ['Fire']),
          p('Venusaur', 65, ['Grass', 'Poison']),
        ],
      },
    },
  ];
})();

window.TYPE_COLORS = {
  Normal: '#A8A878', Fire: '#F08030', Water: '#6890F0', Electric: '#F8D030',
  Grass: '#78C850', Ice: '#98D8D8', Fighting: '#C03028', Poison: '#A040A0',
  Ground: '#E0C068', Flying: '#A890F0', Psychic: '#F85888', Bug: '#A8B820',
  Rock: '#B8A038', Ghost: '#705898', Dragon: '#7038F8', Dark: '#705848',
  Steel: '#B8B8D0', Fairy: '#EE99AC',
};

window.CAT_META = {
  rival: { label: 'Rival', color: '#dc2626', bg: '#fee2e2', icon: '⚔️' },
  gym: { label: 'Líder de Ginásio', color: '#15803d', bg: '#dcfce7', icon: '🏅' },
  villain: { label: 'Team Rocket', color: '#581c87', bg: '#f3e8ff', icon: '🦹' },
  e4: { label: 'Elite dos Quatro', color: '#b45309', bg: '#fef3c7', icon: '👑' },
  champ: { label: 'Campeão', color: '#d97706', bg: '#fef3c7', icon: '🏆' },
};

</script>
<script>
  let starter = 'char';
  let filter = 'all';
  const $rows = document.getElementById('rows');
  const teamFor = b => b.teams.all || b.teams[starter] || [];

  function render() {
    $rows.innerHTML = '';
    BOSSES.filter(b => filter === 'all' || b.cat === filter).forEach(b => {
      const meta = CAT_META[b.cat];
      const team = teamFor(b);
      const row = document.createElement('div');
      row.className = 'row';
      row.dataset.cat = b.cat;
      row.innerHTML = `
        <div class="num-cell"><span class="cat-stripe"></span>#${String(b.n).padStart(2,'0')}</div>
        <div>
          <div class="name">${b.name.replace(/ — .*$/, '')}</div>
          <div class="name-sub">
            <span class="tag" style="background:${meta.bg};color:${meta.color}">${meta.icon} ${meta.label}${b.badge ? ' · ' + b.badge : ''}</span>
          </div>
        </div>
        <div class="loc-cell">📍 ${b.loc}</div>
        <div><div class="cap-cell">Lv ${b.cap}</div></div>
        <div class="team-cell">
          ${team.map(m => `
            <span class="mini">
              <span class="dot" style="background:${TYPE_COLORS[m.t[0]] || '#888'}"></span>
              ${m.n} <span class="mini-lvl">L${m.l}</span>
            </span>
          `).join('')}
        </div>
        <div class="reward-cell">💰 $${b.reward.toLocaleString('pt-BR')}</div>
      `;
      const detail = document.createElement('div');
      detail.className = 'detail';
      detail.innerHTML = `
        <div class="note">💡 ${b.note}</div>
        <div class="team-full">
          ${team.map(m => `
            <div class="mon">
              <div class="mon-name"><span>${m.n}</span><span class="mon-lvl">Lv${m.l}</span></div>
              <div class="types">${m.t.map(t => `<span class="type" style="background:${TYPE_COLORS[t] || '#888'}">${t}</span>`).join('')}</div>
            </div>
          `).join('')}
        </div>
      `;
      row.addEventListener('click', () => row.classList.toggle('open'));
      $rows.appendChild(row);
      $rows.appendChild(detail);
    });
  }

  document.querySelectorAll('.pill.starter').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.pill.starter').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); starter = b.dataset.starter; render();
  }));
  document.querySelectorAll('.pill.filter').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.pill.filter').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); filter = b.dataset.filter; render();
  }));

  render();
</script>
</body>
</html>

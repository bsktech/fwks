<title>Bosses — Versão A · Trilha Vertical</title>

<style>
  :root {
    --g900:#0d2b14; --g800:#14532d; --g700:#166534; --g600:#15803d;

    --pixel:'Press Start 2P', monospace; --sans:'Inter', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh}
  .wrap{max-width:1080px;margin:0 auto;padding:2.5rem 2rem 5rem}
  h1{font-family:var(--pixel);font-size:1.4rem;color:var(--g700);letter-spacing:1px;margin-bottom:.6rem}
  .sub{color:var(--ink3);font-size:.95rem;margin-bottom:2rem;max-width:640px;line-height:1.5}
  .starter-bar{display:flex;gap:.6rem;align-items:center;margin-bottom:2.5rem;padding:1rem 1.2rem;background:var(--surface);border:1.5px solid var(--rule);border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .starter-bar > span{font-weight:700;font-size:.9rem;color:var(--ink2);margin-right:.4rem}
  .starter-btn{font-family:var(--sans);font-weight:600;font-size:.88rem;padding:.55rem 1.1rem;border-radius:100px;border:1.5px solid var(--rule);background:#fff;color:var(--ink2);cursor:pointer;transition:all .15s;display:inline-flex;gap:.4rem;align-items:center}
  .starter-btn:hover{border-color:var(--g400);color:var(--g700)}
  .starter-btn.active{background:var(--g500);color:#fff;border-color:var(--g500);box-shadow:0 2px 8px rgba(22,163,74,.3)}

  .trail{position:relative;padding-left:3.5rem}
  .trail::before{content:'';position:absolute;left:1.25rem;top:0;bottom:0;width:3px;background:linear-gradient(to bottom,var(--g300),var(--g600));border-radius:2px}

  .region{font-family:var(--pixel);font-size:.7rem;color:var(--g700);text-transform:uppercase;letter-spacing:2px;margin:2rem 0 1rem;display:flex;align-items:center;gap:.8rem}
  .region::before{content:'';width:8px;height:8px;background:var(--g500);border-radius:2px;box-shadow:0 0 0 4px var(--g100);margin-left:-2.6rem}

  .node{position:relative;margin-bottom:1.2rem}
  .node::before{content:'';position:absolute;left:-2.5rem;top:1.4rem;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--g500);box-shadow:0 0 0 4px var(--bg)}
  .node[data-cat="rival"]::before{border-color:#dc2626}
  .node[data-cat="gym"]::before{border-color:#15803d}
  .node[data-cat="villain"]::before{border-color:#581c87}
  .node[data-cat="e4"]::before{border-color:#b45309}
  .node[data-cat="champ"]::before{border-color:#d97706;background:#fbbf24}

  .card{background:var(--surface);border:1.5px solid var(--rule);border-radius:16px;overflow:hidden;transition:box-shadow .2s,border-color .2s}
  .card:hover{box-shadow:0 8px 24px rgba(0,0,0,.08);border-color:var(--g300)}
  .card-head{padding:1rem 1.3rem;display:flex;align-items:center;gap:1rem;cursor:pointer;user-select:none}
  .num{font-family:var(--pixel);font-size:.7rem;color:var(--ink3);min-width:32px}
  .head-main{flex:1;min-width:0}
  .title-row{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap}
  .title{font-weight:700;font-size:1rem;color:var(--ink)}
  .loc{color:var(--ink3);font-size:.82rem}
  .tag{display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .6rem;border-radius:100px;font-size:.7rem;font-weight:700;letter-spacing:.3px}
  .cap{font-family:var(--pixel);font-size:.75rem;padding:.5rem .8rem;border-radius:10px;background:linear-gradient(135deg,var(--g500),var(--g700));color:#fff;box-shadow:0 2px 8px rgba(22,163,74,.3);white-space:nowrap}
  .chev{color:var(--ink3);transition:transform .2s;font-size:1.1rem}
  .card.open .chev{transform:rotate(90deg)}
  .body{display:none;padding:0 1.3rem 1.3rem;border-top:1px solid var(--rule)}
  .card.open .body{display:block}
  .team{display:flex;flex-wrap:wrap;gap:.7rem;padding-top:1rem}
  .mon{background:var(--bg);border:1px solid var(--rule);border-radius:12px;padding:.7rem .85rem .65rem;display:flex;flex-direction:column;align-items:center;gap:.45rem;min-width:128px;flex:0 0 128px;transition:border-color .15s,transform .15s}
  .mon:hover{border-color:var(--g300);transform:translateY(-2px)}
  .mon-img{width:80px;height:80px;object-fit:contain;image-rendering:auto;filter:drop-shadow(0 2px 4px rgba(0,0,0,.12))}
  .mon-name{font-weight:700;font-size:.85rem;color:var(--ink);text-align:center;line-height:1.15}
  .mon-lvl{color:var(--g700);font-family:var(--pixel);font-size:.6rem;background:var(--g100);padding:.18rem .45rem;border-radius:6px}
  .types{display:flex;gap:.25rem;flex-wrap:wrap;justify-content:center}
  .type{font-size:.6rem;font-weight:700;padding:.2rem .45rem;border-radius:6px;color:#fff;text-transform:uppercase;letter-spacing:.3px}
</style>
</head>

  ];

  let starter = 'char';
  const $trail = document.getElementById('trail');

  function imgName(name) {
    return name.toLowerCase().replace(/\./g, '').replace(/\s+/g, '-');
  }

  function teamFor(b) {
    return b.teams.all || b.teams[starter] || [];
  }

  function render() {
    $trail.innerHTML = '';
    REGION_GROUPS.forEach(g => {
      const h = document.createElement('div');
      h.className = 'region';
      h.textContent = g.label;
      $trail.appendChild(h);
      BOSSES.filter(b => b.n >= g.range[0] && b.n <= g.range[1]).forEach(b => {
        const meta = CAT_META[b.cat];
        const team = teamFor(b);
        const node = document.createElement('div');
        node.className = 'node';
        node.dataset.cat = b.cat;
        node.innerHTML = `
          <div class="card">
            <div class="card-head">
              <div class="num">#${String(b.n).padStart(2, '0')}</div>
              <div class="head-main">
                <div class="title-row">
                  <span class="tag" style="background:${meta.bg};color:${meta.color}">${meta.icon} ${meta.label}${b.badge ? ' · ' + b.badge : ''}</span>
                </div>
                <div class="title">${b.name}</div>
                <div class="loc">📍 ${b.loc}</div>
              </div>
              <div class="cap">Lv ${b.cap}</div>
              <div class="chev">▸</div>
            </div>
            <div class="body">
              <div class="team">
                ${team.map(m => `
                  <div class="mon">
                    <img class="mon-img" src="../public/${imgName(m.n)}.png" alt="${m.n}" onerror="this.style.visibility='hidden'" />
                    <div class="mon-name">${m.n}</div>
                    <span class="mon-lvl">Lv ${m.l}</span>
                    <div class="types">${m.t.map(t => `<span class="type" style="background:${TYPE_COLORS[t] || '#888'}">${t}</span>`).join('')}</div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
        node.querySelector('.card-head').addEventListener('click', () => {
          node.querySelector('.card').classList.toggle('open');
        });
        $trail.appendChild(node);
      });
    });
  }

  document.querySelectorAll('.starter-btn').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.starter-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      starter = b.dataset.starter;
      render();
    });
  });

  render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>FWKS Overlay</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { width: 100%; height: 100%; }

    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #091a0c;
      position: relative;
      transform-origin: top left;
    }

    /* BACKGROUND */
    .bg {
      position: absolute;
      top: 0; left: 0; width: 1920px; height: 1080px;
      background: linear-gradient(160deg, #0d2b14 0%, #0a2218 45%, #091a0c 100%);
    }
    .bg::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background:
        radial-gradient(ellipse at 20% 80%, rgba(34,197,94,.07) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(22,163,74,.05) 0%, transparent 50%);
    }
    .bg::after {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    /*
      Layout (todos os valores em px, sem calc):
      ─────────────────────────────────────────
      Margem:        20px
      Painel direito: width 380px, right 20px → left edge em 1520px
      Gap game↔painel: 16px  → game right edge em 1504px
      Game left: 20px  → game width: 1504-20 = 1484px

      Brand bar:  top 0,   left 20, width 1484, height 58
      Game:       top 64,  left 20, width 1484, height 910   (64+910=974)
      Gap:        8px
      Bottom bar: top 982, left 20, width 1484, height 78    (982+78=1060 → 20px margem ✓)

      Painel:     top 20,  right 20, width 380, height 1040  (20+1040=1060 → 20px margem ✓)
        Facecam:  top 20,  right 20, width 380, height 210
        Gap:      12px
        Side:     top 242, right 20, width 380, height 818   (242+818=1060 ✓)
    */

    /* BRAND BAR */
    .brand-bar {
      position: absolute;
      top: 0; left: 20px;
      width: 1484px; height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border-bottom: 1px solid rgba(74,222,128,.18);
    }
    .brand-logo {
      width: 34px; height: 34px;
      object-fit: contain;
    }
    .brand-text {
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      letter-spacing: 5px;
      color: #4ade80;
      text-shadow: 0 0 18px rgba(74,222,128,.5);
      animation: glow 3s ease-in-out infinite;
    }
    @keyframes glow {
      0%,100% { text-shadow: 0 0 16px rgba(74,222,128,.4); }
      50%      { text-shadow: 0 0 28px rgba(74,222,128,.7); }
    }

    /* GAME AREA */
    .game {
      position: absolute;
      top: 64px; left: 20px;
      width: 1484px; height: 910px;
      border: 2px solid rgba(74,222,128,.4);
      border-radius: 14px;
      background: rgba(0,0,0,.25);
      box-shadow: 0 0 0 4px rgba(34,197,94,.05), 0 0 30px rgba(22,163,74,.1);
    }

    /* BOTTOM — slot esquerdo */
    .bot-left {
      position: absolute;
      top: 982px; left: 20px;
      width: 735px; height: 78px;
      border: 1.5px solid rgba(74,222,128,.35);
      border-radius: 14px;
      background: rgba(13,43,20,.85);
      box-shadow: 0 4px 20px rgba(22,163,74,.1);
    }

    /* BOTTOM — slot direito */
    .bot-right {
      position: absolute;
      top: 982px; left: 769px;
      width: 735px; height: 78px;
      border: 1.5px solid rgba(74,222,128,.35);
      border-radius: 14px;
      background: rgba(13,43,20,.85);
      box-shadow: 0 4px 20px rgba(22,163,74,.1);
    }

    /* FACECAM — alinhada com o topo do game (top 64) */
    /* top 64, height 210 → bottom 274 */
    .facecam {
      position: absolute;
      top: 64px; right: 20px;
      width: 380px; height: 210px;
      border: 2px solid rgba(74,222,128,.4);
      border-radius: 14px;
      background: rgba(13,43,20,.8);
      box-shadow: 0 4px 20px rgba(22,163,74,.14);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .facecam-logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 24px;
      opacity: 0.18;
    }

    /* BADGES — top 286 (274+12), height 70 → bottom 356 */
    .badges {
      position: absolute;
      top: 286px; right: 20px;
      width: 380px; height: 70px;
      border: 1.5px solid rgba(74,222,128,.3);
      border-radius: 14px;
      background: rgba(13,43,20,.8);
      box-shadow: 0 4px 20px rgba(22,163,74,.1);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 14px;
    }
    .badge {
      width: 38px; height: 38px;
      border: 1.5px solid rgba(74,222,128,.3);
      border-radius: 8px;
      background: rgba(34,197,94,.08);
    }
    .badge.earned {
      background: rgba(251,191,36,.12);
      border-color: rgba(251,191,36,.5);
      box-shadow: 0 0 8px rgba(251,191,36,.2);
    }

    /* SIDE PANEL — top 368 (356+12), height: 1060-368 = 692 */
    .side {
      position: absolute;
      top: 368px; right: 20px;
      width: 380px; height: 692px;
      border: 1.5px solid rgba(74,222,128,.3);
      border-radius: 14px;
      background: rgba(13,43,20,.8);
      box-shadow: 0 4px 20px rgba(22,163,74,.1);
    }
  </style>
</head>
<body>
  <div class="bg"></div>

  <div class="brand-bar">
    <img src="./logo.png" alt="FWKS" class="brand-logo" />
    <span class="brand-text">FWKS</span>
  </div>

  <div class="game"></div>

  <div class="bot-left"></div>
  <div class="bot-right"></div>

  <div class="facecam">
    <img src="./public/logo.png" alt="Fwks" class="facecam-logo" />
  </div>

  <div class="badges">
    <div class="badge"></div>
    <div class="badge"></div>
    <div class="badge"></div>
    <div class="badge"></div>
    <div class="badge"></div>
    <div class="badge"></div>
    <div class="badge"></div>
    <div class="badge"></div>
  </div>

  <div class="side"></div>
  <script>
    function scale() {
      var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      document.body.style.transform = 'scale(' + s + ')';
    }
    scale();
    window.addEventListener('resize', scale);
  </script>
</body>
</html>
